<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista del Super</title>
    <style>
        /* Estilos Minimalistas Dark Mode */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #121212; 
            color: #e0e0e0; 
            display: flex;
            justify-content: center;
        }
        .container { 
            width: 100%;
            max-width: 500px; 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.4); 
        }
        h2 { 
            text-align: center; 
            color: #ffffff; 
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        /* Formulario Estilizado */
        .form-group { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-bottom: 25px; 
        }
        input { 
            padding: 14px; 
            background-color: #2a2a2a;
            border: 1px solid #3d3d3d; 
            border-radius: 8px; 
            font-size: 15px; 
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #00adb5;
        }
        input::placeholder {
            color: #757575;
        }
        
        /* Botones Modernos */
        button { 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            font-size: 15px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.2s; 
        }
        .btn-add { 
            background-color: #00adb5; 
            color: #ffffff; 
        }
        .btn-add:hover { 
            background-color: #008c95; 
        }
        .btn-reset { 
            background-color: transparent; 
            color: #ff4444; 
            width: 100%; 
            margin-top: 25px; 
            border: 1px solid #ff4444;
        }
        .btn-reset:hover { 
            background-color: rgba(255, 68, 68, 0.1); 
        }
        
        /* Lista/Tabla Limpia */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
            font-size: 15px; 
        }
        td { 
            padding: 16px 8px; 
            text-align: left; 
            border-bottom: 1px solid #2d2d2d; 
        }
        tr.comprado td { 
            text-decoration: line-through; 
            color: #666666; 
        }
        .checkbox-cell, .action-cell { 
            text-align: center; 
            width: 45px; 
        }
        
        /* Checkbox Personalizado Minimalista */
        input[type="checkbox"] { 
            accent-color: #00adb5;
            transform: scale(1.2); 
            cursor: pointer; 
        }
        
        /* Boton Eliminar Discreto */
        .btn-delete { 
            background: none; 
            border: none; 
            color: #757575; 
            font-size: 14px; 
            cursor: pointer; 
            padding: 4px; 
        }
        .btn-delete:hover { 
            color: #ff4444; 
        }
        
        /* Modulo de Compartir */
        .share-box { 
            margin-top: 25px; 
            padding: 20px; 
            background: #252d3a; 
            border: 1px solid #3b485c;
            border-radius: 10px; 
            text-align: center; 
            display: none; 
        }
        .share-text {
            display: block;
            font-size: 13px; 
            color: #90caf9; 
            margin-bottom: 12px;
            font-weight: 500;
        }
        .btn-share { 
            background-color: #2196f3; 
            color: white; 
            width: 100%; 
            font-size: 14px; 
            padding: 12px; 
        }
        .btn-share:hover { 
            background-color: #1e88e5; 
        }
        
        /* Etiquetas secundarias */
        .sub-info {
            font-size: 12px;
            color: #757575;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Lista del Super</h2>
    
    <div class="form-group">
        <input type="text" id="producto" placeholder="Que falta? (ej: Leche)" required>
        <input type="text" id="tienda" placeholder="En que tienda? (ej: Costo)">
        <input type="number" id="cantidad" placeholder="Cantidad" min="1" value="1">
        <button class="btn-add" onclick="agregarArticulo()">Anadir Producto</button>
    </div>

    <table>
        <tbody id="cuerpoTabla"></tbody>
    </table>

    <div class="share-box" id="shareBox">
        <span class="share-text">Lista lista para enviar</span>
        <button class="btn-share" onclick="copiarEnlace()">Copiar Link de WhatsApp</button>
    </div>

    <button class="btn-reset" onclick="resetearLista()">Borrar Toda la Lista</button>
</div>

<script>
    let listaSuper = [];

    function cargarListaDeUrl() {
        const params = new URLSearchParams(window.location.search);
        const datosUrl = params.get('data');
        
        if (datosUrl) {
            try {
                const textoPlano = decodeURIComponent(atob(datosUrl));
                listaSuper = JSON.parse(textoPlano);
            } catch (e) {
                listaSuper = [];
            }
        } else {
            listaSuper = JSON.parse(localStorage.getItem('local_super_dark')) || [];
        }
        renderizarTabla();
        actualizarBotonCompartir();
    }

    function guardarEstado() {
        localStorage.setItem('local_super_dark', JSON.stringify(listaSuper));
        
        if (listaSuper.length > 0) {
            const textoCodigo = btoa(encodeURIComponent(JSON.stringify(listaSuper)));
            const nuevoLink = window.location.origin + window.location.pathname + '?data=' + textoCodigo;
            window.history.replaceState(null, '', nuevoLink);
        } else {
            window.history.replaceState(null, '', window.location.origin + window.location.pathname);
        }
        actualizarBotonCompartir();
    }

    function actualizarBotonCompartir() {
        const box = document.getElementById('shareBox');
        if (listaSuper.length > 0) {
            box.style.display = 'block';
        } else {
            box.style.display = 'none';
        }
    }

    function copiarEnlace() {
        navigator.clipboard.writeText(window.location.href);
        alert("Link copiado. Pegalo en el chat de tu familia.");
    }

    function renderizarTabla() {
        const tabla = document.getElementById('cuerpoTabla');
        tabla.innerHTML = '';
        listaSuper.forEach((articulo, index) => {
            const fila = document.createElement('tr');
            if (articulo.comprado) fila.classList.add('comprado');
            
            const infoTienda = articulo.tienda ? ` <span class="sub-info">(${articulo.tienda})</span>` : '';
            
            fila.innerHTML = `
                <td class="checkbox-cell">
                    <input type="checkbox" ${articulo.comprado ? 'checked' : ''} onclick="alternarComprado(${index})">
                </td>
                <td>
                    ${articulo.producto}${infoTienda}
                </td>
                <td style="text-align: right; color: #757575; width: 40px; padding-right: 15px;">
                    x${articulo.cantidad}
                </td>
                <td class="action-cell">
                    <button class="btn-delete" onclick="eliminarArticulo(${index})">Borrar</button>
                </td>
            `;
            tabla.appendChild(fila);
        });
    }

    function agregarArticulo() {
        const prodInput = document.getElementById('producto');
        const tiendaInput = document.getElementById('tienda');
        const cantInput = document.getElementById('cantidad');

        if (prodInput.value.trim() === '') return;

        listaSuper.push({
            producto: prodInput.value.trim(),
            tienda: tiendaInput.value.trim(),
            cantidad: parseInt(cantInput.value) || 1,
            comprado: false
        });

        renderizarTabla();
        guardarEstado();

        prodInput.value = '';
        tiendaInput.value = '';
        cantInput.value = '1';
        prodInput.focus();
    }

    function alternarComprado(index) {
        listaSuper[index].comprado = !listaSuper[index].comprado;
        renderizarTabla();
        guardarEstado();
    }

    function eliminarArticulo(index) {
        listaSuper.splice(index, 1);
        renderizarTabla();
        guardarEstado();
    }

    function resetearLista() {
        if (confirm('Quieres borrar todos los productos?')) {
            listaSuper = [];
            renderizarTabla();
            guardarEstado();
        }
    }

    cargarListaDeUrl();
</script>
</body>
</html>
